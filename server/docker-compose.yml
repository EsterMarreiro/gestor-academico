services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gestor-academico-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: gestor
      RABBITMQ_DEFAULT_PASS: gestor
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
      build:
        context: .
        target: builder
      container_name: gestor-academico-migrate
      environment:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      command: npx prisma migrate deploy
      depends_on:
        db:
          condition: service_healthy
        
  usuarios-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-usuarios-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      USERS_MS_PORT: 4001
      USERS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:usuarios-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  turmas-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-turmas-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      TURMAS_MS_PORT: 4002
      TURMAS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:turmas-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  cursos-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-cursos-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      CURSOS_MS_PORT: 4003
      CURSOS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:cursos-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  disciplinas-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-disciplinas-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      DISCIPLINAS_MS_PORT: 4004
      DISCIPLINAS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:disciplinas-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  matriculas-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-matriculas-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      MATRICULAS_MS_PORT: 4005
      MATRICULAS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:matriculas-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  matriculas-rmq-consumer:
    build:
      context: .
      target: builder
    container_name: gestor-academico-matriculas-rmq-consumer
    environment:
      NODE_ENV: development
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:matriculas-rmq-consumer:dev
    depends_on:
      rabbitmq:
        condition: service_healthy

  aulas-ms:
    build:
      context: .
      target: builder
    container_name: gestor-academico-aulas-ms
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      AULAS_MS_PORT: 4006
      AULAS_MS_BIND: 0.0.0.0
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:aulas-ms:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      target: builder
    container_name: gestor-academico-dev
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_academico
      NODE_ENV: development
      USERS_MS_HOST: usuarios-ms
      USERS_MS_PORT: 4001
      TURMAS_MS_HOST: turmas-ms
      TURMAS_MS_PORT: 4002
      CURSOS_MS_HOST: cursos-ms
      CURSOS_MS_PORT: 4003
      DISCIPLINAS_MS_HOST: disciplinas-ms
      DISCIPLINAS_MS_PORT: 4004
      MATRICULAS_MS_HOST: matriculas-ms
      MATRICULAS_MS_PORT: 4005
      AULAS_MS_HOST: aulas-ms
      AULAS_MS_PORT: 4006
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:gateway:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      usuarios-ms:
        condition: service_started
      turmas-ms:
        condition: service_started
      cursos-ms:
        condition: service_started
      disciplinas-ms:
        condition: service_started
      matriculas-ms:
        condition: service_started
      aulas-ms:
        condition: service_started

  db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_academico
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-dev
    ports:
      - '8080:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data_dev:
  pgadmin_data: