services:
  migrate:
    build:
      context: .
      target: production
    container_name: gestor-academico-migrate-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  usuarios-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-usuarios-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      USERS_MS_BIND: 0.0.0.0
      USERS_MS_PORT: 4001
    expose:
      - '4001'
    command: ['node', 'dist/main.usuarios-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  turmas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-turmas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      TURMAS_MS_BIND: 0.0.0.0
      TURMAS_MS_PORT: 4002
    expose:
      - '4002'
    command: ['node', 'dist/main.turmas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  cursos-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-cursos-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      CURSOS_MS_BIND: 0.0.0.0
      CURSOS_MS_PORT: 4003
    expose:
      - '4003'
    command: ['node', 'dist/main.cursos-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: production
    container_name: gestor-academico-app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      USERS_MS_HOST: usuarios-ms
      USERS_MS_PORT: 4001
      TURMAS_MS_HOST: turmas-ms
      TURMAS_MS_PORT: 4002
      CURSOS_MS_HOST: cursos-ms
      CURSOS_MS_PORT: 4003
    command: ['node', 'dist/main.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      usuarios-ms:
        condition: service_started
      turmas-ms:
        condition: service_started
      cursos-ms:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: postgres-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: