services:
  migrate:
    build:
      context: .
      target: production
    container_name: gestor-academico-migrate-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-gestor_academico}
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gestor-academico-rabbitmq-prod
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: gestor
      RABBITMQ_DEFAULT_PASS: gestor
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gestor-academico-redis-prod
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  usuarios-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-usuarios-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-gestor_academico}
      NODE_ENV: production
      USERS_MS_BIND: 0.0.0.0
      USERS_MS_PORT: 4001
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4001'
    command: ['node', 'dist/main.usuarios-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  turmas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-turmas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-gestor_academico}
      NODE_ENV: production
      TURMAS_MS_BIND: 0.0.0.0
      TURMAS_MS_PORT: 4002
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4002'
    command: ['node', 'dist/main.turmas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  cursos-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-cursos-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-gestor_academico}
      NODE_ENV: production
      CURSOS_MS_BIND: 0.0.0.0
      CURSOS_MS_PORT: 4003
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4003'
    command: ['node', 'dist/main.cursos-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
