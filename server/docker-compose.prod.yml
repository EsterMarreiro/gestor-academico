services:
  migrate:
    build:
      context: .
      target: production
    container_name: gestor-academico-migrate-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gestor-academico-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: gestor
      RABBITMQ_DEFAULT_PASS: gestor
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  usuarios-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-usuarios-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      USERS_MS_BIND: 0.0.0.0
      USERS_MS_PORT: 4001
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4001'
    command: ['node', 'dist/main.usuarios-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  turmas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-turmas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      TURMAS_MS_BIND: 0.0.0.0
      TURMAS_MS_PORT: 4002
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4002'
    command: ['node', 'dist/main.turmas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  cursos-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-cursos-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      CURSOS_MS_BIND: 0.0.0.0
      CURSOS_MS_PORT: 4003
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4003'
    command: ['node', 'dist/main.cursos-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  disciplinas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-disciplinas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      DISCIPLINAS_MS_BIND: 0.0.0.0
      DISCIPLINAS_MS_PORT: 4004
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4004'
    command: ['node', 'dist/main.disciplinas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  matriculas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-matriculas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      MATRICULAS_MS_BIND: 0.0.0.0
      MATRICULAS_MS_PORT: 4005
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4005'
    command: ['node', 'dist/main.matriculas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  matriculas-rmq-consumer:
    build:
      context: .
      target: production
    container_name: gestor-academico-matriculas-rmq-consumer-prod
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    command: ['node', 'dist/main.matriculas-rmq-consumer.js']
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  aulas-ms:
    build:
      context: .
      target: production
    container_name: gestor-academico-aulas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      AULAS_MS_BIND: 0.0.0.0
      AULAS_MS_PORT: 4006
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4006'
    command: ['node', 'dist/main.aulas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: production
    container_name: gestor-academico-app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      USERS_MS_HOST: usuarios-ms
      USERS_MS_PORT: 4001
      TURMAS_MS_HOST: turmas-ms
      TURMAS_MS_PORT: 4002
      CURSOS_MS_HOST: cursos-ms
      CURSOS_MS_PORT: 4003
      DISCIPLINAS_MS_HOST: disciplinas-ms
      DISCIPLINAS_MS_PORT: 4004
      MATRICULAS_MS_HOST: matriculas-ms
      MATRICULAS_MS_PORT: 4005
      AULAS_MS_HOST: aulas-ms
      AULAS_MS_PORT: 4006
    command: ['node', 'dist/main.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      usuarios-ms:
        condition: service_started
      turmas-ms:
        condition: service_started
      cursos-ms:
        condition: service_started
      disciplinas-ms:
        condition: service_started
      matriculas-ms:
        condition: service_started
      aulas-ms:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: postgres-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: