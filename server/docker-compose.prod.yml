    container_name: gestor-academico-disciplinas-ms-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-gestor_academico}
      NODE_ENV: production
      DISCIPLINAS_MS_BIND: 0.0.0.0
      DISCIPLINAS_MS_PORT: 4004
      RABBITMQ_URL: amqp://gestor:gestor@rabbitmq:5672
    expose:
      - '4004'
    command: ['node', 'dist/main.disciplinas-ms.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
